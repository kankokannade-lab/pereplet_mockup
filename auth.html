<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Переплёт — Авторизация и Регистрация</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <!-- Главный контейнер -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    
    <!-- Шапка / Переключатель вкладок -->
    <div class="flex border-b border-slate-100 bg-slate-50/50 p-1.5">
      <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all bg-white text-indigo-600 shadow-sm">
        Вход
      </button>
      <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-500 hover:text-slate-800">
        Регистрация
      </button>
    </div>

    <div class="p-6">
      
      <!-- ================= ФОРМА ВХОДА ================= -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Email</label>
          <input type="email" required placeholder="user@example.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Пароль</label>
            <a href="#" class="text-xs text-indigo-600 hover:underline font-medium">Забыли?</a>
          </div>
          <input type="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl shadow-md shadow-indigo-100 transition-all active:scale-[0.99]">
          Войти в аккаунт
        </button>
      </form>

      <!-- ================= ФОРМА РЕГИСТРАЦИИ ================= -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Имя или Никнейм</label>
          <input type="text" name="username" required placeholder="Александр" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Email</label>
          <input type="email" name="email" required placeholder="user@example.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Пароль</label>
          <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>

        <!-- Выбор роли -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Ваша роль на платформе</label>
          <div class="grid grid-cols-2 gap-3">
            
            <!-- Вариант: Переводчик -->
            <label class="role-card relative flex flex-col items-center justify-center p-3.5 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-400 transition-all">
              <input type="radio" name="user_role" value="translator" required onchange="handleRoleChange(this.value)" class="sr-only">
              <span class="text-2xl mb-1">✍️</span>
              <span class="font-medium text-xs text-slate-700">Переводчик</span>
            </label>

            <!-- Вариант: Читатель -->
            <label class="role-card relative flex flex-col items-center justify-center p-3.5 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-400 transition-all">
              <input type="radio" name="user_role" value="reader" required onchange="handleRoleChange(this.value)" class="sr-only">
              <span class="text-2xl mb-1">📖</span>
              <span class="font-medium text-xs text-slate-700">Читатель</span>
            </label>

          </div>
        </div>

        <!-- Вложенный выбор для Читателя -->
        <div id="readerSubOptions" class="hidden space-y-2 p-3 bg-indigo-50/70 border border-indigo-100 rounded-xl animate-fade-in">
          <label class="block text-[11px] font-bold text-indigo-900 uppercase tracking-wider mb-1">Что вас больше интересует?</label>
          
          <div class="space-y-2">
            <label class="flex items-start p-2.5 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-indigo-300 transition-all">
              <input type="radio" name="reader_focus" value="grammar" class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
              <div class="ml-2.5">
                <span class="block text-xs font-semibold text-slate-800">Интересуюсь грамматикой</span>
                <span class="block text-[11px] text-slate-500 leading-tight">Вычистка, бета-ридинг, согласование стыков текстов</span>
              </div>
            </label>

            <label class="flex items-start p-2.5 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-indigo-300 transition-all">
              <input type="radio" name="reader_focus" value="plot" class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
              <div class="ml-2.5">
                <span class="block text-xs font-semibold text-slate-800">Интересуюсь сюжетом</span>
                <span class="block text-[11px] text-slate-500 leading-tight">Чтение готовых глав, оценка веток, обсуждения</span>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl shadow-md shadow-indigo-100 transition-all active:scale-[0.99]">
          Зарегистрироваться
        </button>
      </form>

    </div>
  </div>

  <!-- JS Логика -->
  <script>
    // Переключение Вход / Регистрация
    function switchTab(type) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLogin.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all bg-white text-indigo-600 shadow-sm';
        tabRegister.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-500 hover:text-slate-800';
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabRegister.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all bg-white text-indigo-600 shadow-sm';
        tabLogin.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-500 hover:text-slate-800';
      }
    }

    // Обработка динамического выбора роли
    function handleRoleChange(role) {
      const readerOptions = document.getElementById('readerSubOptions');
      const grammarRadio = document.querySelector('input[name="reader_focus"][value="grammar"]');
      const plotRadio = document.querySelector('input[name="reader_focus"][value="plot"]');

      // Подсветка активной карточки
      document.querySelectorAll('.role-card').forEach(card => {
        const radio = card.querySelector('input[type="radio"]');
        if (radio.checked) {
          card.classList.add('border-indigo-600', 'bg-indigo-50/50');
          card.classList.remove('border-slate-200');
        } else {
          card.classList.remove('border-indigo-600', 'bg-indigo-50/50');
          card.classList.add('border-slate-200');
        }
      });

      // Отображение подблока для читателя
      if (role === 'reader') {
        readerOptions.classList.remove('hidden');
        grammarRadio.required = true;
      } else {
        readerOptions.classList.add('hidden');
        grammarRadio.required = false;
        grammarRadio.checked = false;
        plotRadio.checked = false;
      }
    }

    // Обработка отправки формы Входа
    function handleLogin(e) {
      e.preventDefault();
      alert('Успешный вход!');
    }

    // Обработка отправки формы Регистрации
    function handleRegister(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      
      console.log('Зарегистрированные данные:', data);
      alert(`Регистрация успешна! Роль: ${data.user_role}` + (data.reader_focus ? ` (${data.reader_focus})` : ''));
    }
  </script>
</body>
</html>
